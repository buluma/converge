version: 2
updates:
  # JS/TS dependencies (bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Packages that share internals must move together: a split @sentry/*
    # version breaks typecheck (two @sentry/core copies), and prisma CLI,
    # client and adapters, or vitest and @vitest/*, should not drift apart.
    groups:
      sentry:
        patterns: ["@sentry/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # From 11.13 @sentry/nextjs resolves a "bun" export (index.bun.js) when
      # it runs under Bun, which the Docker image does. Next's standalone
      # tracing only copies the Node entry, so the server can't load Sentry
      # at runtime. Hold at 11.12 until that is solved.
      - dependency-name: "@sentry/*"
        versions: [">= 11.13.0"]

  # Dockerfile / Dockerfile.pi base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
