version: 2
updates:
  # JS/TS dependencies (bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Packages that share internals must move together: a split @sentry/*
    # version breaks typecheck (two @sentry/core copies), and prisma CLI,
    # client and adapters, or vitest and @vitest/*, should not drift apart.
    groups:
      sentry:
        patterns: ["@sentry/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]

  # Dockerfile / Dockerfile.pi base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
